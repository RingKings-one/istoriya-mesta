name: Astro build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.5'
      - run: npm ci
      - run: npm ls --all --json > dependency-tree.json
      - run: npm run test:images
      - run: npm run test:local-images
      - run: npm audit --json > /tmp/npm-audit.json || true
      - run: npm run audit:report -- /tmp/npm-audit.json --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence
          path: |
            package-lock.json
            dependency-tree.json
            /tmp/npm-audit.json
          if-no-files-found: error
      - run: npm run build
      - run: npm run check:links
      - name: Install isolated browser QA tooling
        run: |
          npm install --prefix /tmp/browser-qa --no-save --package-lock=false playwright@1.58.2
          ln -s /tmp/browser-qa/node_modules/playwright node_modules/playwright
          /tmp/browser-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Run browser checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/browser-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence/
