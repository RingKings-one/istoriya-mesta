name: Astro build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.5'
      - run: npm ci
      - run: npm ls --all --json > dependency-tree.json
      - run: npm run test:images
      - run: npm run test:local-images
      - run: npm audit --json > /tmp/npm-audit.json || true
      - run: npm run audit:report -- /tmp/npm-audit.json --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence
          path: |
            package-lock.json
            dependency-tree.json
            /tmp/npm-audit.json
          if-no-files-found: error
      - run: npm run build
      - run: npm run check:links
